name: Release Foundry Module

on:
  push:
    tags:
      - '*.*.*'           # 匹配語意化版本標籤，例如 1.5.3.3.0
      - 'v*.*.*'          # 也支援 v1.5.3.3.0 格式
  workflow_dispatch:      # 允許手動觸發

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # 需要權限來建立/上傳 Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 確保能取得所有 tags

      - name: Read version from module.json
        id: get_version
        run: |
          VERSION=$(jq -r '.version' module.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version from module.json: $VERSION"

      - name: Verify tag matches module.json version (if tag exists)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/}
          TAG_VERSION=${TAG_VERSION#v}   # 移除可能的 v 前綴
          MODULE_VERSION="${{ steps.get_version.outputs.version }}"

          if [ "$TAG_VERSION" != "$MODULE_VERSION" ]; then
            echo "::warning::Tag version ($TAG_VERSION) does not match module.json version ($MODULE_VERSION)"
            echo "建議使用與 module.json 相同的版本號建立 tag"
          else
            echo "✓ Tag version matches module.json version"
          fi

      - name: Create module.zip (only lang/, module.json, README.md)
        run: |
          mkdir -p dist
          zip -r dist/module.zip \
            lang/ \
            module.json \
            README.md

          echo "Created dist/module.zip with the following contents:"
          unzip -l dist/module.zip

      - name: Create GitHub Release and upload module.zip
        uses: softprops/action-gh-release@v2
        with:
          # 如果 tag 已存在，會附加檔案；若無則自動建立 Release
          tag_name: ${{ github.ref_name }}
          name: "v${{ steps.get_version.outputs.version }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/module.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Output release info
        run: |
          echo "✅ Release 打包完成！"
          echo "版本: ${{ steps.get_version.outputs.version }}"
          echo "檔案: module.zip（僅包含 lang/、module.json、README.md）"

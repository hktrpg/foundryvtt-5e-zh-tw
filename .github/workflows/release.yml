name: Release Foundry Module

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*.*.*'
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from module.json
        id: get_version
        run: |
          VERSION=$(jq -r '.version' module.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version in module.json: $VERSION"

      # 只有在 push 到 main/master 時才檢查是否已經有這個版本的 Release
      - name: Check if this version already has a release (branch push only)
        id: check_release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release v${VERSION} already exists. Skipping..."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Release v${VERSION} does not exist yet. Will create it."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if release already exists
        if: steps.check_release.outputs.exists == 'true'
        run: |
          echo "✅ Release v${{ steps.get_version.outputs.version }} 已存在，跳過打包"
          exit 0

      - name: Create module.zip (lang/, module.json, README.md only)
        run: |
          mkdir -p dist
          zip -r dist/module.zip \
            lang/ \
            module.json \
            README.md

          echo "Created dist/module.zip:"
          unzip -l dist/module.zip

      - name: Create GitHub Release + Upload module.zip
        uses: softprops/action-gh-release@v2
        with:
          # 使用 module.json 裡的版本作為 tag 名稱
          tag_name: v${{ steps.get_version.outputs.version }}
          name: v${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/module.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Success message
        run: |
          echo "✅ 成功建立 Release v${{ steps.get_version.outputs.version }}"
          echo "檔案: module.zip（僅包含 lang/、module.json、README.md）"
          echo "下載連結: https://github.com/${{ github.repository }}/releases/download/v${{ steps.get_version.outputs.version }}/module.zip"